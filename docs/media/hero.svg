<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-label="Overview">
<style>
  .win { fill:#1c1d22; } .side { fill:#24252b; } .bar { fill:#2a2b32; }
  .t { font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif; fill:#e8e8ee; }
  .s { fill:#9a9aa6; } .b { font-weight:600; } .m { font-family:'SF Mono',Menlo,Consolas,monospace; }
  .card { fill:#26272e; stroke:#33343c; }
  .acc { fill:#3b82f6; } .ok { fill:#34c759; } .warn { fill:#ff9f0a; } .bad { fill:#ff453a; } .teal { fill:#40c8e0; } .pink { fill:#ff6b9d; }
  .loop { animation-duration:9s; animation-iteration-count:infinite; animation-timing-function:cubic-bezier(.4,0,.2,1); }
  @media (prefers-reduced-motion: reduce) { .loop { animation:none !important; } }

  .scanbar { animation-name: scan; } @keyframes scan { 0%{width:0} 22%{width:560px} 23%,100%{width:560px;opacity:0} }
  .row { opacity:0; animation-name: rowin; } @keyframes rowin { 0%,24%{opacity:0;transform:translateX(16px)} 30%,62%{opacity:1;transform:none} 72%,100%{opacity:0;transform:translateX(300px)} }
  .r2 { animation-delay:.25s } .r3 { animation-delay:.5s } .r4 { animation-delay:.75s }
  .tick { opacity:0; animation-name: tick; } @keyframes tick { 0%,44%{opacity:0} 48%,66%{opacity:1} 72%,100%{opacity:0} }
  .t2 { animation-delay:.2s } .t3 { animation-delay:.4s } .t4 { animation-delay:.6s }
  .used { animation-name: used; transform-origin: center; } @keyframes used { 0%,66%{stroke-dashoffset:40} 80%,100%{stroke-dashoffset:150} }
  .free1 { animation-name: f1; } @keyframes f1 { 0%,66%{opacity:1} 72%,100%{opacity:0} }
  .free2 { animation-name: f2; opacity:0 } @keyframes f2 { 0%,70%{opacity:0} 78%,96%{opacity:1} 100%{opacity:0} }
  .btn { animation-name: press; transform-origin: 520px 360px; } @keyframes press { 0%,58%{transform:scale(1)} 61%{transform:scale(.92)} 64%,100%{transform:scale(1)} }
  .bin { animation-name: bin; transform-origin: 556px 300px; } @keyframes bin { 0%,66%{transform:scale(1)} 70%{transform:scale(1.18)} 76%,100%{transform:scale(1)} }
</style>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".35"/></filter>
  <linearGradient id="ring" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
</defs>
<rect x="10" y="8" width="800" height="446" rx="14" class="win" filter="url(#sh)"/>
<path d="M10 22 a14 14 0 0 1 14 -14 H190 V454 H24 a14 14 0 0 1 -14 -14 Z" class="side"/>
<circle cx="32" cy="30" r="6" fill="#ff5f57"/><circle cx="52" cy="30" r="6" fill="#febc2e"/><circle cx="72" cy="30" r="6" fill="#28c840"/>
<g transform="translate(0,0)"><rect x="10" y="63" width="170" height="24" rx="6" class="acc" opacity=".9"/><text x="24" y="79" class="t" font-size="12.5" >Overview</text><text x="24" y="109" class="t" font-size="12.5" opacity=".8">Cleanup</text><text x="24" y="139" class="t" font-size="12.5" opacity=".8">Security</text><text x="24" y="169" class="t" font-size="12.5" opacity=".8">Secrets</text><text x="24" y="199" class="t" font-size="12.5" opacity=".8">Code Backup</text><text x="24" y="229" class="t" font-size="12.5" opacity=".8">Apps &amp; Extensions</text><text x="24" y="259" class="t" font-size="12.5" opacity=".8">Offload to Drive</text><text x="24" y="289" class="t" font-size="12.5" opacity=".8">Project Doctor</text><text x="24" y="319" class="t" font-size="12.5" opacity=".8">Space Timeline</text></g>
<text x="214" y="36" class="t b" font-size="15">Overview</text>
<g transform="translate(206,52)">
<text x="8" y="22" class="t s" font-size="11.5">Smart disk cleanup for developers</text>
<rect x="8" y="38" width="560" height="6" rx="3" fill="#33343c"/><rect x="8" y="38" height="6" rx="3" class="acc scanbar loop"/>
<text x="8" y="66" class="t b" font-size="20">Recommended cleanup</text>
<text x="8" y="94" class="t" font-size="26" font-weight="700" fill="#34c759">16.6 GB</text>
<text x="120" y="94" class="t s" font-size="11">across 4 items · nothing deleted until you review</text>
<g class="row loop r1"><rect x="0" y="128" width="430" height="38" rx="8" class="card"/>
<text x="14" y="144" class="t b" font-size="12.5">node_modules</text><text x="14" y="159" class="t s" font-size="10.5">DayBloom · untouched 3 months</text>
<rect x="300" y="139" width="56" height="16" rx="8" class="ok" opacity=".22"/><text x="328" y="151" class="t" font-size="9.5" text-anchor="middle">Safe</text>
<text x="420" y="152" class="t m" font-size="12" text-anchor="end">1.5 GB</text>
<g class="tick loop t1"><circle cx="-12" cy="147" r="8" class="ok"/><path d="M-16 147 l3 3 l6 -6" stroke="#fff" stroke-width="2" fill="none"/></g></g><g class="row loop r2"><rect x="0" y="174" width="430" height="38" rx="8" class="card"/>
<text x="14" y="190" class="t b" font-size="12.5">DerivedData</text><text x="14" y="205" class="t s" font-size="10.5">Xcode builds</text>
<rect x="300" y="185" width="56" height="16" rx="8" class="ok" opacity=".22"/><text x="328" y="197" class="t" font-size="9.5" text-anchor="middle">Safe</text>
<text x="420" y="198" class="t m" font-size="12" text-anchor="end">6.2 GB</text>
<g class="tick loop t2"><circle cx="-12" cy="193" r="8" class="ok"/><path d="M-16 193 l3 3 l6 -6" stroke="#fff" stroke-width="2" fill="none"/></g></g><g class="row loop r3"><rect x="0" y="220" width="430" height="38" rx="8" class="card"/>
<text x="14" y="236" class="t b" font-size="12.5">.next cache</text><text x="14" y="251" class="t s" font-size="10.5">AFLABS-CX · rebuilds on dev</text>
<rect x="300" y="231" width="56" height="16" rx="8" class="ok" opacity=".22"/><text x="328" y="243" class="t" font-size="9.5" text-anchor="middle">Safe</text>
<text x="420" y="244" class="t m" font-size="12" text-anchor="end">5.1 GB</text>
<g class="tick loop t3"><circle cx="-12" cy="239" r="8" class="ok"/><path d="M-16 239 l3 3 l6 -6" stroke="#fff" stroke-width="2" fill="none"/></g></g><g class="row loop r4"><rect x="0" y="266" width="430" height="38" rx="8" class="card"/>
<text x="14" y="282" class="t b" font-size="12.5">Rust target/</text><text x="14" y="297" class="t s" font-size="10.5">Old experiment</text>
<rect x="300" y="277" width="56" height="16" rx="8" class="acc" opacity=".22"/><text x="328" y="289" class="t" font-size="9.5" text-anchor="middle">Low risk</text>
<text x="420" y="290" class="t m" font-size="12" text-anchor="end">3.8 GB</text>
<g class="tick loop t4"><circle cx="-12" cy="285" r="8" class="ok"/><path d="M-16 285 l3 3 l6 -6" stroke="#fff" stroke-width="2" fill="none"/></g></g>
<g transform="translate(500,96)">
  <circle cx="56" cy="56" r="46" fill="none" stroke="#33343c" stroke-width="12"/>
  <circle cx="56" cy="56" r="46" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="40" transform="rotate(-90 56 56)" class="used loop"/>
  <text x="56" y="54" class="t b free1 loop" font-size="15" text-anchor="middle">7.2 GB</text>
  <text x="56" y="54" class="t b free2 loop" font-size="15" text-anchor="middle" fill="#34c759">23.8 GB</text>
  <text x="56" y="72" class="t s" font-size="10" text-anchor="middle">free</text>
</g>
<g class="bin loop"><rect x="520" y="282" width="72" height="32" rx="8" fill="#2f3038"/><text x="556" y="303" class="t" font-size="16" text-anchor="middle">🗑</text></g>
<g class="btn loop"><rect x="452" y="340" width="140" height="34" rx="9" class="acc"/><text x="522" y="362" class="t b" font-size="12.5" text-anchor="middle">Review &amp; Clean</text></g>
</g>
</svg>