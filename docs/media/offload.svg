<rect x="400" y="10" width="190" height="220" rx="12" class="card ssd loop"/><text x="495" y="36" class="t b" font-size="12.5" text-anchor="middle">⏏ Work HD (SSD)</text>
<g class="mv loop"><path d="M30 66 h18 l5 -6 h27 a4 4 0 0 1 4 4 v34 a4 4 0 0 1 -4 4 h-46 a4 4 0 0 1 -4 -4 Z" fill="#3b82f6" opacity=".9"/><text x="57" y="116" class="t" font-size="10" text-anchor="middle">Projects</text></g>
<g class="mv loop d2"><path d="M118 66 h18 l5 -6 h27 a4 4 0 0 1 4 4 v34 a4 4 0 0 1 -4 4 h-46 a4 4 0 0 1 -4 -4 Z" fill="#3b82f6" opacity=".9"/><text x="145" y="116" class="t" font-size="10" text-anchor="middle">Downloads</text></g>
<g class="mv loop d3"><path d="M30 146 h18 l5 -6 h27 a4 4 0 0 1 4 4 v34 a4 4 0 0 1 -4 4 h-46 a4 4 0 0 1 -4 -4 Z" fill="#3b82f6" opacity=".9"/><text x="57" y="196" class="t" font-size="10" text-anchor="middle">Documents</text></g>
